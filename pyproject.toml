[project]
name = "pixi_cookiecutter"
description = "Cookiecutter for setting up python projects with pixi that just work"
license = "MIT"
version = "0.1.0"
readme = "README.md"
keywords = ["cookiecutter", "pixi"]
authors = [{name = "Jonathon Vandezande"}]
requires-python = ">=3.13"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
cookiecutter = ">=2.6"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default"}

[tool.pixi.feature.dev.tasks]
fmt = { cmd="ruff format hooks" }
lint = { cmd="ruff check hooks --fix" }
mdfmt = { cmd="rumdl fmt ." }
mdlint = { cmd="rumdl check . --fix" }
types = { cmd="ty check hooks" }
test = { cmd="pytest" }
all = { depends-on = ["fmt", "lint", "mdfmt", "mdlint", "types", "test"] }

# Non-mutating variants for CI
fmt-check = { cmd="ruff format hooks --check --diff" }
lint-check = { cmd="ruff check hooks" }
mdfmt-check = { cmd="rumdl fmt . --check --diff" }
mdlint-check = { cmd="rumdl check ." }
check = { depends-on = ["fmt-check", "lint-check", "mdfmt-check", "mdlint-check", "types", "test"] }

[tool.pixi.feature.dev.dependencies]
prek = ">=0.3.13"
pytest = ">=9"
pytest-cov = ">=7"
ruff = ">=0.15"

[tool.pixi.feature.dev.pypi-dependencies]
rumdl = ">=0.1.91"
ty = ">=0.0.34"

[tool.ruff]
# *.md keeps ruff from reformatting Python code blocks in documentation
extend-exclude = ["\\{\\{cookiecutter.package_name\\}\\}", "*.md"]
line-length = 100

[tool.ruff.lint]
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming conventions
    "W",  # pycodestyle warnings
    "C4", # comprehensions
    "PL", # pylint
    "PT", # flake8-pytest-style
    "PIE", # misc lints
    "PYI", # flake8-pyi
    "TID", # tidy imports
    "TCH", # type-checking imports
    "RUF", # Ruff-specific rules
    "RSE", # flake8-raise
    "ICN001", # unconventional-import-alias
]
ignore = [
    "RUF001",  # Ambiguous unicode character in string
    "RUF002",  # Ambiguous unicode character in docstring
    "N806", # Non-lowercase variable in function
    "PLR0911", # Too many returns
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0914", # Too many locals
    "PLR0915", # Too many statements
    "PLR1702", # Too many nested-blocks
    "PT013",   # Incorrect import of pytest
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["hooks"]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE"

[tool.coverage.run]
source = ["hooks"]

[tool.coverage.report]
exclude_lines = [
    # Have to re-enable the standard pragma
    'pragma: no cover',

    # Don't complain about missing debug-only code:
    'def __repr__',
    'if self\.debug',

    # Don't complain if tests don't hit defensive assertion code:
    'raise AssertionError',
    'raise NotImplementedError',

    # Don't complain if non-runnable code isn't run:
    'if 0:',
    'if __name__ == .__main__.:',

    # Don't complain if an ellipsis isn't run (typically in an abstractmethod):
    '^\s*\.\.\.',
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
