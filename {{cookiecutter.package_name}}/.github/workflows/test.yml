name: Test

on:
  pull_request: {}
  push:
    branches: master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.14']
        os: [ubuntu-latest]

    name: Python ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.66.0
          cache: true
          environments: dev
          locked: true

      - name: Check TOML/YAML/whitespace
        run: |
          pixi run -e dev -- prek run --all-files --show-diff-on-failure --color=always \
            check-toml \
            check-yaml \
            trailing-whitespace \
            end-of-file-fixer

      - run: pixi run mdfmt-check
      - run: pixi run mdlint-check

      - run: pixi run fmt-check
      - run: pixi run lint-check

      - run: pixi run types

      - run: pixi run test --cov --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
