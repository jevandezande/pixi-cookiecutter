[global]

disable = [
    "MD013",  # line length
    "MD033",  # no inline HTML
]

exclude = [
    ".git",
    ".pixi",
    "node_modules",
    "vendor",
    "dist",
    "build",
]

respect-gitignore = true

[per-file-ignores]
# Skill files start with instructions, not headings
".claude/**/*.md" = ["MD041"]
".agent/**/*.md" = ["MD041"]
