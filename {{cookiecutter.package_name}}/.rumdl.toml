[global]

disable = [
    "MD013",  # line length
    "MD033",  # no inline HTML
]

exclude = [
    ".git",
    ".pixi",
    ".venv",
    "node_modules",
    "vendor",
    "dist",
    "build",
]

respect-gitignore = true

[per-file-ignores]
# Skill files start with frontmatter, not headings
"**/skills/**/*.md" = ["MD041"]
# CLAUDE.md only imports AGENTS.md
"CLAUDE.md" = ["MD041"]
