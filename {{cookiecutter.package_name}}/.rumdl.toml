[global]

disable = [
    "MD013",  # line length
    "MD033",  # no inline HTML
    "MD075",  # pipe rows without table header (false positives from LaTeX math with |)
]

exclude = [
    ".git",
    ".pixi",
    ".venv",
    "node_modules",
    "vendor",
    "dist",
    "build",
]

respect-gitignore = true

[per-file-ignores]
# Skill files start with frontmatter, not headings
"**/skills/**/*.md" = ["MD041"]
"**/.github/pull_request_template.md" = ["MD041"]  # GitHub supplies the title
