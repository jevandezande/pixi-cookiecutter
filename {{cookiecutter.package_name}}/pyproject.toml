[project]
name = "{{cookiecutter.package_name}}"
description = "{{cookiecutter.project_name}}"
{%- if cookiecutter.license != 'None' %}
license = "{{cookiecutter.license}}"
{%- endif %}
version = "0.0.1"
readme = "README.md"
keywords = []
{%- if cookiecutter.author_name %}
authors = [{name = "{{cookiecutter.author_name}}"}]
{%- endif %}
requires-python = ">={python_version}"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
{pixi_dependencies}

[tool.pixi.pypi-dependencies]
{{cookiecutter.package_name}} = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default"}

[tool.pixi.feature.dev.tasks]
fmt = { cmd="ruff format ." }
lint = { cmd="ruff check . --fix" }
mdfmt = { cmd="rumdl fmt ." }
mdlint = { cmd="rumdl check . --fix" }
types = { cmd="ty check" }
test = { cmd="pytest" }
all = { depends-on = ["fmt", "lint", "mdfmt", "mdlint", "types", "test"] }

# Non-mutating variants for CI
fmt-check = { cmd="ruff format . --check --diff" }
lint-check = { cmd="ruff check ." }
mdfmt-check = { cmd="rumdl fmt . --check --diff" }
mdlint-check = { cmd="rumdl check ." }
check = { depends-on = ["fmt-check", "lint-check", "mdfmt-check", "mdlint-check", "types", "test"] }

[tool.pixi.feature.dev.dependencies]
pytest = ">=9"
pytest-cov = ">=7"
ruff = ">=0.16"
prek = ">=0.5"
{pixi_test_dependencies}

[tool.pixi.feature.dev.pypi-dependencies]
rumdl = ">=0.2"
ty = ">=0.0.75"

[tool.ruff]
extend-exclude = ["*.md"]
line-length = {{cookiecutter.line_length}}

[tool.ruff.lint]
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming conventions
    "W",  # pycodestyle warnings
    "C4", # comprehensions
    "PL", # pylint
    "PT", # flake8-pytest-style
    "PIE", # misc lints
    "PYI", # flake8-pyi
    "TID", # tidy imports
    "TC", # type-checking imports
    "RUF", # Ruff-specific rules
    "RSE", # flake8-raise
    "ICN001", # unconventional-import-alias
]
ignore = [
    "RUF001",  # Ambiguous unicode character in string
    "RUF002",  # Ambiguous unicode character in docstring
    "N806", # Non-lowercase variable in function
    "PLR0911", # Too many returns
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0914", # Too many locals
    "PLR0915", # Too many statements
    "PLR1702", # Too many nested-blocks
    "PT013",   # Incorrect import of pytest
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests", "{{cookiecutter.package_name}}"]
addopts = "--doctest-modules --durations=5 -m 'not regression'"
doctest_optionflags = "NORMALIZE_WHITESPACE"
markers = [
    "regression: tests to make sure bugs stay closed",
]

[tool.coverage.run]
source = ["{{cookiecutter.package_name}}"]
omit = ["{{cookiecutter.package_name}}/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'if self\.debug',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    '^\s*\.\.\.',
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
