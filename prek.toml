exclude = '.pixi/'
default_stages = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-yaml" },
  { id = "check-toml", exclude = "{{cookiecutter.package_name}}/pyproject.toml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rumdl-fmt"
name = "rumdl-fmt"
language = "system"
entry = "pixi run mdfmt"
types = ["markdown"]
pass_filenames = false

[[repos.hooks]]
id = "rumdl-check"
name = "rumdl-check"
language = "system"
entry = "pixi run mdlint"
types = ["markdown"]
pass_filenames = false

[[repos.hooks]]
id = "ruff-format"
name = "ruff-format"
language = "system"
entry = "pixi run fmt"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "ruff-check"
name = "ruff-check"
language = "system"
entry = "pixi run lint"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "ty"
name = "ty"
language = "system"
entry = "pixi run types"
types = ["python"]
pass_filenames = false

[[repos.hooks]]
id = "pytest"
name = "pytest"
language = "system"
entry = "pixi run test"
types = ["python"]
pass_filenames = false
