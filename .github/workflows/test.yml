name: Test Pixi Cookiecutter

on:
  pull_request: {}
  push:
    branches: master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
        os: [ubuntu-latest]

    name: Python ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.66.0
          cache: true
          environments: dev
          locked: true

      - run: pixi global install direnv

      - name: Check TOML/YAML/whitespace
        run: |
          pixi run -e dev -- prek run --all-files --show-diff-on-failure --color=always \
            check-toml \
            check-yaml \
            trailing-whitespace \
            end-of-file-fixer

      - run: pixi run mdfmt-check
      - run: pixi run mdlint-check

      - run: pixi run fmt-check
      - run: pixi run lint-check

      - run: pixi run types

      - run: pixi run test --cov --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "default@example.com"
          git config --global user.name "Default Name"
          git config --global init.defaultBranch master

      - name: Run cookiecutter
        run: |
          pixi run cookiecutter . --no-input --config-file template_config.yml -o ..

      - name: Run prek
        run: |
          cd ../pixi_project
          direnv allow .
          pixi run -e dev prek -a
